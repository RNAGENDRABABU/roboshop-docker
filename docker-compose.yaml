services:
  catalogue:
    build:
      dockerfile: catalogue.Dockerfile
    image: joindevops/catalogue:1.0.0
    container_name: catalogue
    depends_on:
      - mongodb
    ports:
      - "8080:8080"  
  user:
    build:
      dockerfile: user.Dockerfile
    image: joindevops/user:1.0.0
    container_name: user
    depends_on:
      - redis
  frontend:
    build: ./frontend
    image: joindevops/frontend:1.0.0
    container_name: frontend
    depends_on:
      - catalogue
      - user
    ports:
      - "80:80"      
  mongodb:
    build:
      dockerfile: mongodb.Dockerfile
    image: joindevops/mongodb:1.0.0
    container_name: mongodb
  redis:
      image: redis:7.0
      container_name: redis

networks:
  default:
    driver: bridge
    name: roboshop
    external: false
